<!DOCTYPE html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1B3A78" />
    <link rel="icon" type="image/png" href="/Z_logo.png" />
    <link rel="apple-touch-icon" href="/Z_logo.png" />
    <title>Crew Portal</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f5f4f0; font-family: 'Avenir Next', 'Avenir', 'Century Gothic', 'Nunito', system-ui, sans-serif; }
      @keyframes zFloat { 0%,100% { transform: translateY(0) translateX(0) } 33% { transform: translateY(-9px) translateX(4px) } 66% { transform: translateY(5px) translateX(-4px) } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
      @keyframes zFadeIn { from { opacity: 0; transform: scale(.92) } to { opacity: 1; transform: none } }
      @keyframes zSlideIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
